tags:
  - Contacts
summary: Create contact
operationId: createCreate
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - _id
          - name
          - phoneNumber
          - isFavourite
          - contactType
          - createdAt
          - updatedAt

        properties:
          name:
            description: 'Contact`s name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact`s phoneNumber'
            type: string
            example: '+380000000007'
          contactType:
            description: 'Contact`s contactType'
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: 'Contact`s parent id'
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            description: 'Contact`s photo'
            type: string
            format: binary
            example: null
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a student!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
