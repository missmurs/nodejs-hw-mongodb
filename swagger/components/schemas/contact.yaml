type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - createdAt
  - updatedAt
properties:
  _id:
    description: 'Contact`s id'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: 'Contact`s name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact`s phoneNumber'
    type: string
    example: '+380000000007'
  email:
    description: 'Contact`s email'
    type: string
    example: 'andriy7@example.com'
  contactType:
    description: 'Contact`s contactType'
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: 'Contact`s parent id'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: 'Link to contact`s photo'
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
